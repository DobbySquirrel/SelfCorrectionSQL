# Alpha-SQL 配置文件示例
# 复制此文件并修改为您的配置

# 预处理后的任务文件路径（由 preprocessor 生成）
tasks_file_path: "data/preprocessed/dev/tasks.pkl"

# 子集文件路径（可选，用于只运行部分任务）
subset_file_path: null

# 数据库根目录
db_root_dir: "/ssd/shenshuyu/work/bird/dev_20240627/dev_databases"

# 并行进程数
n_processes: 32

# MCTS 参数
max_rollout_steps: 24  # 每次 rollout 的最大步数
max_depth: 16          # MCTS 树的最大深度
exploration_constant: 1.414  # UCB 探索常数

# 结果保存目录
save_root_dir: "results/Qwen2.5-Coder-32B-Instruct/dev"

# LLM 模型配置
# 注意：base_url 和 api_key 可以从环境变量读取（OPENAI_API_BASE 和 OPENAI_API_KEY）
# 如果使用本地 vLLM 服务，也可以设置 VLLM_API_URL 和 VLLM_API_KEY
mcts_model_kwargs:
    model: "Qwen/Qwen2.5-Coder-32B-Instruct"  # 模型名称（本地模型使用实际服务名称）
    n: 3                    # 每次生成的候选数
    top_p: 0.8             # nucleus sampling 参数
    max_tokens: 4096       # 最大 token 数
    temperature: 0.8       # 温度参数
    n_strategy: "single"    # 策略：single 或 multiple
    base_url: "http://localhost:8008/v1"  # 可选：如果不在环境变量中设置
    api_key: "dummy-key"  # 可选：如果不在环境变量中设置

# 奖励模型配置（可选）
reward_model_kwargs: null

# 随机种子
random_seed: 42

